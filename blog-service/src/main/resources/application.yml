springdotenv:
  directory: ..
  ignore-if-missing: true

server:
  port: ${PORT:8083}

spring:
  application:
    name: blog-service
  data:
    mongodb:
      uri: ${DATABASE_URI:mongodb://localhost:27017/dotblog_blog}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

dotblog:
  kafka:
    topics:
      blog-published: dotblog.blog.published
      media-deletion-requested: dotblog.media.deletion-requested

app:
  jwt:
    secret: ${JWT_SECRET:Dot-Blog2_SecretKey}
  user-service:
    base-url: ${USER_SERVICE_URI:http://localhost:8082}
  media-service:
    base-url: ${MEDIA_SERVICE_URI:http://localhost:8085}
    thumbnail-folder: Dot-Blog/Blog_Thumbnails

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
