springdotenv:
  directory: ${SPRINGDOTENV_DIRECTORY:..}
  ignore-if-missing: true

server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${DATABASE_URI:mongodb://localhost:27017/dotblog}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

dotblog:
  kafka:
    topics:
      otp-requested: dotblog.auth.otp-requested

# JWT secret (use JWT_SECRET env to match Node: Dot-Blog2_SecretKey)
app:
  jwt:
    secret: ${JWT_SECRET:Dot-Blog2_SecretKey}
  encryption:
    two-way-secret: ${TWO_WAY_SECRET:}
  email:
    api-key: ${RESEND_API_KEY:}
    sender-email: ${SENDER_MAIL_ID:}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
