# Render blueprint for Dot-Blog backend — all-Web-Service, free-tier layout.
# -----------------------------------------------------------------------------
# 6 public Web Services on Render's free tier. Inter-service traffic stays on
# Render's internal private network (services reach each other at
# http://<service-name>:10000 without going through the public internet).
#
# Free-tier caveats:
#   - 512 MB RAM, 0.1 CPU per instance. Spring Boot apps may be slow; if any
#     service OOMs at startup, upgrade just that one to `plan: starter`.
#   - Services sleep after ~15 min of inactivity. First request after idle
#     incurs a ~30s cold start. Run `scripts/smoke.sh` twice if the first
#     attempt times out.
#
# SECURITY WARNING:
#   media-service exposes /internal/upload and /internal/delete with no auth.
#   On Render free tier it must be a public Web Service (Private Services
#   require a paid plan), which means those endpoints are reachable from the
#   internet. Add a shared-secret header check on /internal/* before opening
#   to real users, or upgrade media-service alone to `pserv` on starter plan.
#
# Usage: push this file, then in Render dashboard:
#   New + -> Blueprint -> connect this repo -> fill in secret env vars -> Apply.

services:
  # ------------------------------------------------------------------
  # media-service — Cloudinary credentials live here only.
  # ------------------------------------------------------------------
  - type: web
    name: media-service
    runtime: docker
    plan: free
    dockerfilePath: ./media-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ------------------------------------------------------------------
  # auth-service — register / login / OTP / password reset.
  # ------------------------------------------------------------------
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: DATABASE_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TWO_WAY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_MAIL_ID
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ------------------------------------------------------------------
  # user-service — profile read/update, author lookups, photo uploads.
  # ------------------------------------------------------------------
  - type: web
    name: user-service
    runtime: docker
    plan: free
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: DATABASE_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MEDIA_SERVICE_URI
        value: http://media-service:10000
      - key: BLOG_SERVICE_URI
        value: http://blog-service:10000

  # ------------------------------------------------------------------
  # blog-service — blog CRUD, publish, soft-delete, list endpoints.
  # ------------------------------------------------------------------
  - type: web
    name: blog-service
    runtime: docker
    plan: free
    dockerfilePath: ./blog-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: DATABASE_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: USER_SERVICE_URI
        value: http://user-service:10000
      - key: MEDIA_SERVICE_URI
        value: http://media-service:10000

  # ------------------------------------------------------------------
  # engagement-service — like / dislike / comment.
  # ------------------------------------------------------------------
  - type: web
    name: engagement-service
    runtime: docker
    plan: free
    dockerfilePath: ./engagement-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: DATABASE_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: USER_SERVICE_URI
        value: http://user-service:10000

  # ------------------------------------------------------------------
  # gateway — public entry point for the React client.
  # ------------------------------------------------------------------
  - type: web
    name: gateway
    runtime: docker
    plan: free
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: AUTH_SERVICE_URI
        value: http://auth-service:10000
      - key: USER_SERVICE_URI
        value: http://user-service:10000
      - key: BLOG_SERVICE_URI
        value: http://blog-service:10000
      - key: ENGAGEMENT_SERVICE_URI
        value: http://engagement-service:10000
