# Render blueprint for Dot-Blog backend — all-Web-Service, free-tier layout.
# -----------------------------------------------------------------------------
# 6 public Web Services on Render's free tier.
#
# IMPORTANT — inter-service URLs are MANUAL on free tier.
#   Free Web Services on Render CANNOT receive private-network traffic
#   (https://render.com/docs/free). So services must call each other over
#   public https://*.onrender.com URLs. Those URLs include a random hash
#   that Render only generates at first deploy, so we can't hardcode them
#   here — they're marked `sync: false` and you fill them in after the
#   first deploy via each service's Environment tab.
#
# Free-tier caveats:
#   - 512 MB RAM, 0.1 CPU per instance. If any service OOMs, upgrade just
#     that one to `plan: starter`.
#   - Services sleep after ~15 min of inactivity. First request after idle
#     incurs a ~30s cold start. Run `scripts/smoke.sh` twice if the first
#     attempt times out.
#   - Inter-service traffic uses public URLs (counts toward outbound
#     bandwidth, ~5 GB/month included).
#
# SECURITY WARNING:
#   media-service exposes /internal/upload and /internal/delete with no auth.
#   On Render free tier it must be a public Web Service (Private Services
#   require a paid plan), which means those endpoints are reachable from the
#   internet. Add a shared-secret header check on /internal/* before opening
#   to real users, or upgrade media-service alone to `pserv` on starter plan.
#
# Usage: push this file, then in Render dashboard:
#   New + -> Blueprint -> connect this repo -> fill in secret env vars -> Apply.

services:
  # ------------------------------------------------------------------
  # media-service — Cloudinary credentials live here only.
  # ------------------------------------------------------------------
  - type: web
    name: media-service
    runtime: docker
    plan: free
    dockerfilePath: ./media-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ------------------------------------------------------------------
  # auth-service — register / login / OTP / password reset.
  # ------------------------------------------------------------------
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: DATABASE_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TWO_WAY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_MAIL_ID
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ------------------------------------------------------------------
  # user-service — profile read/update, author lookups, photo uploads.
  # ------------------------------------------------------------------
  - type: web
    name: user-service
    runtime: docker
    plan: free
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: DATABASE_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MEDIA_SERVICE_URI
        sync: false   # https://media-service-XXXX.onrender.com
      - key: BLOG_SERVICE_URI
        sync: false   # https://blog-service-XXXX.onrender.com

  # ------------------------------------------------------------------
  # blog-service — blog CRUD, publish, soft-delete, list endpoints.
  # ------------------------------------------------------------------
  - type: web
    name: blog-service
    runtime: docker
    plan: free
    dockerfilePath: ./blog-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: DATABASE_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: USER_SERVICE_URI
        sync: false   # https://user-service-XXXX.onrender.com
      - key: MEDIA_SERVICE_URI
        sync: false   # https://media-service-XXXX.onrender.com

  # ------------------------------------------------------------------
  # engagement-service — like / dislike / comment.
  # ------------------------------------------------------------------
  - type: web
    name: engagement-service
    runtime: docker
    plan: free
    dockerfilePath: ./engagement-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: DATABASE_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: USER_SERVICE_URI
        sync: false   # https://user-service-XXXX.onrender.com

  # ------------------------------------------------------------------
  # gateway — public entry point for the React client.
  # ------------------------------------------------------------------
  - type: web
    name: gateway
    runtime: docker
    plan: free
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRINGDOTENV_ENABLED
        value: "false"
      - key: AUTH_SERVICE_URI
        sync: false   # https://auth-service-XXXX.onrender.com
      - key: USER_SERVICE_URI
        sync: false   # https://user-service-XXXX.onrender.com
      - key: BLOG_SERVICE_URI
        sync: false   # https://blog-service-XXXX.onrender.com
      - key: ENGAGEMENT_SERVICE_URI
        sync: false   # https://engagement-service-XXXX.onrender.com
